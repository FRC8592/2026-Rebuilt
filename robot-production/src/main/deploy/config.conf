  CAMERA_OFFSETS_BACK = { _type = Transform3d, x = -0.08267, y = -0.28369, z = 0.56, pitch = "-15 deg", yaw = "180 deg" }
  CAMERA_OFFSETS_LEFT = { _type = Transform3d, x = -0.07478, y = 0.33655, z = 0.56, pitch = "-15 deg", yaw = "90 deg" }
