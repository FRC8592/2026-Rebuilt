##########
# Base configuration, shared by every robot (HOCON format: https://github.com/lightbend/config/blob/main/HOCON.md)
#
# The build generates src/main/java/frc/robot/Constants.java from this file plus every robot file
# listed in stormconfig.robots below:
#   - Values here are defaults for every robot. Values that only some robots need (CAN IDs, gains,
#     gearing, ...) can live in just those robots' files instead.
#   - A key has the same type in every file, and keys can't differ only by case or underscores.
#   - The sim file (simExtra) only overrides: it can change values but can't add keys.
#   - If a robot's files leave out a key, code on that robot that uses the key's section of
#     Constants (e.g. Constants.TURRET) fails when first used, with a message naming the missing keys.
#
# A value's type is how it is written:
#   true / false              boolean
#   42                        int      (no decimal point)
#   42.0, 4.2e1               double   (needs a decimal point or exponent)
#   "text"                    String   (always quote strings)
#   "-15 deg", "4.5 m/s"      WPILib unit type (Angle, LinearVelocity, ...); see ConfigTypes.java for units
#   { _type = Pose2d, ... }   Pose2d, Transform3d, Color, ...; see ConfigTypes.java for the list
#   [ ..., ... ]              List (every element the same type)
#
# Keys can be written as SWERVE.STEER_KP = 1.0 or nested as SWERVE { STEER_KP = 1.0 }; both mean the same.
# ${SHARED.LOG_FOLDER}"/Vision/" joins strings, using whatever value the robot's files end up with.
# There is no arithmetic: values computed from other values belong in CodeConstants.java.
#
# Tunables: a section can list values that can be changed from the dashboard while the robot runs,
#   TURRET { _tunables = ["TURRET_P", "TURRET_D"] }
# Code then reads them with a method call, Constants.TURRET.TURRET_P(), which returns the current
# value; there is no constant field for them. Code that copies a tunable somewhere (e.g. motor PID
# gains) re-copies it in Constants.TURRET.onTune(...). A section's lists in config.conf and the
# robot files add up; the sim file can't add tunables. Tunables can be boolean, int, double, String
# or a unit type (shown on the dashboard as a number in the unit the robot's file writes it in).
##########

stormconfig {
  # Robots this config knows about, keyed by the MAC address of any network interface.
  # To use a different file on one robot, put   robot = "somefile.conf"   in ~/.stormrc.conf on it.
  robots {
    "00:80:2f:35:54:a0" = "prismarine.conf"
  }
  # In simulation, load this robot's file, then simExtra on top of it.
  sim = "prismarine.conf"
  simExtra = "prismarine.sim.conf"
  # Print the final merged config at startup
  debug = false
}

robotName = "Rebuilt"


##########
# Subsystem Toggles - turn on or off in specific robot files
##########
toggles.useDrive = true
toggles.useShooter = true
toggles.useLights = true
toggles.useVision = false
toggles.useIntake = true

# We generally expect this to be false when running an outreach event, and only true for testing
toggles.useAdvantageKit = true
toggles.usePidTuner = true
# mainly to download elastic-layout.json
toggles.useWebServer = true
toggles.useController = true

##########
# Debug settings
##########
# Be careful with these. During competition this should almost certainly be false
# if the code crashes in a match, we want the robot to restart not hang.
# this is for debugging only - only use these values if debug == true!
debug.debug = false
debug.holdCrash = false
debug.defaultAlliance = "auto"

debug.initPoseX = 0.0
debug.initPoseY = 0.0
debug.initPoseDegrees = 0.0

power.isRevPdh = true
power.moduleID = 1
# Only takes effect in debug mode
power.autoKill = true
power.warnLimit = 12.25
power.shutoffLimit = 11.75

##########
# Console Logging Settings
##########
console.defaultIterations = 50

##########
# IMU Configuration
##########
imu.type = "NavX"
imu.inverted = false
imu.pigeonID = 0
imu.canBusName = ""

##########
# General SparkMax / Neo settings
##########
#sparkConstants.TemperatureRampThreshold= (int) 45
#sparkConstants.TemperatureRampLimit= (int) 60
sparkConstants.CurrentLimit = 80
sparkConstants.FreeSpeedRPM = 5676
sparkConstants.NominalVoltage = 10.0
sparkConstants.Neo550CurrentLimit = 20
sparkConstants.Neo550FreeSpeedRPM = 11000
sparkConstants.Neo550NominalVoltage = 10.0

# Some drives may set these separately
talonConstants.steerStatorCurrentLimit = 40.0
talonConstants.driveStatorCurrentLimit = 80.0
talonConstants.krakenFreeSpeedRPM = 6000.0

##########
# Constants that do not vary by robot
# Robot-specific constants (CAN IDs, gains, gearing, etc.) belong in the robot's .conf file
##########
SHARED.LOG_FOLDER = "CustomLogs"

CONVERSIONS.METERS_TO_FEET = 3.28084
CONVERSIONS.FEET_TO_METERS = 0.3048
CONVERSIONS.INCHES_TO_METERS = 0.0254

CONTROLLERS.DRIVER_PORT = 0
CONTROLLERS.OPERATOR_PORT = 1

# Limelight throttle
VISION.THROTTLE_IDLE = 200
VISION.THROTTLE_ACTIVE = 0
VISION.MAX_ACCEPTABLE_AMBIGUITY = 0.1
VISION.REJECT_SINGLE_TAG_POSE_ESTIMATE_RANGE = 3.5

# Driver feel
SWERVE.TRANSLATE_POWER_FAST = 1.0
SWERVE.ROTATE_POWER_FAST = 0.5
SWERVE.TRANSLATE_POWER_SNAIL = 0.5
SWERVE.TRANSLATE_POWER_LESS_SLOW = 0.75
SWERVE.ROTATE_POWER_SNAIL = 0.3
SWERVE.ROTATE_POWER_LESS_SLOW = 0.5
SWERVE.TRANSLATION_SMOOTHING_AMOUNT = 3
SWERVE.ROTATION_SMOOTHING_AMOUNT = 1
SWERVE.JOYSTICK_EXPONENT = 1.75
SWERVE.SIMULATION_LOOP_PERIOD = 0.005

# Field and physics
# meters
SCORING.TAG_HUB_HEIGHT = 1.12395
# feet
SCORING.HUB_HEIGHT = 6.0
# feet per s^2
SCORING.GRAVITY = 32.174

# meters
RANGE_TABLE.RANGE_TABLE_STEP = 0.2
RANGE_TABLE.MAX_TABLE_DISTANCE = 10.0
