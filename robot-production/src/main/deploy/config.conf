##########
# Base configuration, shared by every robot (HOCON format: https://github.com/lightbend/config/blob/main/HOCON.md)
#
# This file is also the schema. Every key the robot code can read is defined here, and the build
# generates src/main/java/frc/robot/Constants.java from it. Robot files (prismarine.conf, ...) and
# the sim file may change values, but may not add keys or change types; the build fails if they do.
#
# A value's type is how it is written:
#   true / false              boolean
#   42                        int      (no decimal point)
#   42.0, 4.2e1               double   (needs a decimal point or exponent)
#   "text"                    String   (always quote strings)
#   "-15 deg", "4.5 m/s"      WPILib unit type (Angle, LinearVelocity, ...); see ConfigTypes.java for units
#   { _type = Pose2d, ... }   Pose2d, Transform3d, Color, ...; see ConfigTypes.java for the list
#   [ ..., ... ]              List (every element the same type)
#   "@int", "@Angle", ...     no value here: every robot file must set it
#
# Keys can be written as SWERVE.STEER_KP = 1.0 or nested as SWERVE { STEER_KP = 1.0 }; both mean the same.
# ${SHARED.LOG_FOLDER}"/Vision/" joins strings, using whatever value the robot's files end up with.
# There is no arithmetic: values computed from other values belong in CodeConstants.java.
##########

stormconfig {
  # Robots this config knows about, keyed by the MAC address of any network interface.
  # To use a different file on one robot, put   robot = "somefile.conf"   in ~/.stormrc.conf on it.
  robots {
    "00:80:2f:35:54:a0" = "prismarine.conf"
  }
  # In simulation, load this robot's file, then simExtra on top of it.
  sim = "prismarine.conf"
  simExtra = "prismarine.sim.conf"
  # Print the final merged config at startup
  debug = false
}

robotName = "Rebuilt"


##########
# Subsystem Toggles - turn on or off in specific robot files
##########
toggles.useDrive = true
toggles.useShooter = true
toggles.useLights = true
toggles.useVision = false
toggles.useIntake = true

# We generally expect this to be false when running an outreach event, and only true for testing
toggles.useAdvantageKit = true
toggles.usePidTuner = true
# mainly to download elastic-layout.json
toggles.useWebServer = true
toggles.useController = true

##########
# Debug settings
##########
# Be careful with these. During competition this should almost certainly be false
# if the code crashes in a match, we want the robot to restart not hang.
# this is for debugging only - only use these values if debug == true!
debug.debug = false
debug.holdCrash = false
debug.defaultAlliance = "auto"

debug.initPoseX = 0.0
debug.initPoseY = 0.0
debug.initPoseDegrees = 0.0

power.isRevPdh = true
power.moduleID = 1
# Only takes effect in debug mode
power.autoKill = true
power.warnLimit = 12.25
power.shutoffLimit = 11.75

##########
# Console Logging Settings
##########
console.defaultIterations = 50

##########
# IMU Configuration
##########
imu.type = "NavX"
imu.inverted = false
imu.pigeonID = 0
imu.canBusName = ""

##########
# General SparkMax / Neo settings
##########
#sparkConstants.TemperatureRampThreshold= (int) 45
#sparkConstants.TemperatureRampLimit= (int) 60
sparkConstants.CurrentLimit = 80
sparkConstants.FreeSpeedRPM = 5676
sparkConstants.NominalVoltage = 10.0
sparkConstants.Neo550CurrentLimit = 20
sparkConstants.Neo550FreeSpeedRPM = 11000
sparkConstants.Neo550NominalVoltage = 10.0

# Some drives may set these separately
talonConstants.steerStatorCurrentLimit = 40.0
talonConstants.driveStatorCurrentLimit = 80.0
talonConstants.krakenFreeSpeedRPM = 6000.0

